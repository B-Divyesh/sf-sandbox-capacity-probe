[package]
name = "sandbox-capacity-probe"
version = "0.1.0"
edition = "2024"
description = "Bounded Docker and Podman startup-capacity preflight"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/B-Divyesh/sf-sandbox-capacity-probe"
homepage = "https://sandbox-capacity-probe.sociobot.in"
keywords = ["docker", "podman", "capacity", "benchmark", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "scp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
